amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 12.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.1
    update_min_a: 0.1
    transform_tolerance: 1.0
    tf_broadcast: true
    set_initial_pose: false
map_server:
  ros__parameters:
    use_sim_time: true
